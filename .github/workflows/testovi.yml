# Na svaki pull request i push na main: backend testovi (s pravom bazom u Dockeru) i build frontenda.
name: Testovi

on:
  pull_request:
  push:
    branches: [main]

jobs:
  backend:
    name: Backend testovi
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      # Gradle i preuzete biblioteke se pamte između pokretanja, pa je svaki sljedeći brži
      - uses: gradle/actions/setup-gradle@v4

      # gradlew je spremljen bez dozvole za pokretanje (napravljen na Windowsu)
      - run: chmod +x gradlew

      # Testcontainers sam pokrene PostgreSQL u Dockeru, koji GitHubov server već ima
      - run: ./gradlew test

      - name: Izvještaj ako testovi padnu
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: izvjestaj-testova
          path: build/reports/tests/test

  frontend:
    name: Frontend build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - run: npm ci
      - run: npx ng build
services:
  db:
    image: postgres:17
    environment:
      POSTGRES_DB: wedding
      POSTGRES_USER: wedding
      POSTGRES_PASSWORD: wedding
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U wedding -d wedding"]
      interval: 5s
      timeout: 5s
      retries: 10

  app:
    build: .
    ports:
      - "8080:8080"
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://db:5432/wedding
      SPRING_DATASOURCE_USERNAME: wedding
      SPRING_DATASOURCE_PASSWORD: wedding
    depends_on:
      db:
        condition: service_healthy

volumes:
  pgdata:
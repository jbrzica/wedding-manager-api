<!doctype html>
<html lang="hr">
<head>
  <meta charset="utf-8">
  <title>Wedding Manager</title>
  <base href="/">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#fdfcfa">
  <!-- Tema prije učitavanja Angulara, da tamni način ne bljesne bijelo -->
  <script>
    try {
      var t = localStorage.getItem('wm-tema');
      if (t === 'tamno' || t === 'svijetlo') document.documentElement.classList.add(t);
    } catch (e) {}
  </script>
  <link rel="icon" type="image/x-icon" href="favicon.ico">
  <!-- Aplikacija se može dodati na početni zaslon mobitela i otvarati preko cijelog ekrana -->
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="apple-touch-icon" href="apple-touch-icon.png">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-title" content="Weddings">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <link rel="preconnect" href="https://fonts.gstatic.com">
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link href="https://fonts.googleapis.com/icon?family=Material+Icons" rel="stylesheet">
</head>
<body>
  <app-root></app-root>
</body>
</html>

spring.application.name=wedding-manager-api
# Railway (i drugi hostinzi) javljaju port preko varijable PORT
server.port=${PORT:8080}
# Railway prima HTTPS i prosljeđuje aplikaciji običan HTTP; ovako Spring vidi pravu adresu (https://...)
server.forward-headers-strategy=framework
# Browser prepoznaje manifest aplikacije (za dodavanje na početni zaslon) samo s ispravnim tipom
server.mime-mappings.webmanifest=application/manifest+json

# Provjera zdravlja za nadzor (UptimeRobot): /actuator/health javlja radi li aplikacija i baza.
# Samo UP/DOWN bez detalja, da se javno ne vidi ništa o sustavu.
management.endpoints.web.exposure.include=health
management.endpoint.health.show-details=never
# Railway blokira SMTP, pa bi provjera maila stalno javljala DOWN iako mail ide preko Brevo API-ja
management.health.mail.enabled=false

# Baza: lokalne vrijednosti; na serveru se postavljaju varijablama
# SPRING_DATASOURCE_URL, SPRING_DATASOURCE_USERNAME i SPRING_DATASOURCE_PASSWORD
spring.datasource.url=jdbc:postgresql://localhost:5432/wedding
spring.datasource.username=wedding
spring.datasource.password=wedding

# Tablice radi Flyway iz src/main/resources/db/migration; Hibernate samo provjerava da se slažu s entitetima
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=${SHOW_SQL:false}
# Veza s bazom zatvara se na kraju servisne metode, ne na kraju HTTP zahtjeva
spring.jpa.open-in-view=false

# JWT: tajni ključ za potpis tokena. Lokalna vrijednost; na serveru se postavlja varijablom JWT_TAJNA.
app.jwt.tajna=${JWT_TAJNA:YYARpuOZfXWsInxPJx8PvqMwtynfByH6Y17xyJwnUDOk4+G1nsXjaxwNxFTHcA0+}
app.jwt.trajanje-minuta=15
# Refresh token u HttpOnly kolačiću drži prijavu 30 dana; Secure se lokalno može isključiti
app.refresh.trajanje-dana=30
app.refresh.secure-kolacic=${REFRESH_SECURE_KOLACIC:true}

# Mail: lokalno ga hvata Mailpit (http://localhost:8025), na serveru ide preko Breva
spring.mail.host=${MAIL_HOST:localhost}
spring.mail.port=${MAIL_PORT:1025}
spring.mail.username=${MAIL_USERNAME:}
spring.mail.password=${MAIL_PASSWORD:}
spring.mail.properties.mail.smtp.auth=${MAIL_AUTH:false}
spring.mail.properties.mail.smtp.starttls.enable=${MAIL_STARTTLS:false}
app.mail.posiljatelj=${MAIL_POSILJATELJ:Wedding Manager <noreply@wedding-manager.local>}
# Na serveru: Brevo API ključ (Railway blokira SMTP). Prazno = šalje se preko SMTP-a iznad.
app.mail.brevo-api-kljuc=${BREVO_API_KLJUC:}
# Da zahtjev ne visi minutama ako mail server ne odgovara
spring.mail.properties.mail.smtp.connectiontimeout=5000
spring.mail.properties.mail.smtp.timeout=5000
spring.mail.properties.mail.smtp.writetimeout=5000

# Adrese s kojih frontend smije zvati API (na serveru je frontend na istoj adresi, pa ovo ne treba)
app.cors.dozvoljeni=${CORS_DOZVOLJENI:http://localhost:4200}

# Vremenska prognoza s Open-Meteo za vjenčanja idućih 7 dana (besplatno, bez ključa)
app.prognoza.ukljucena=${PROGNOZA_UKLJUCENA:true}

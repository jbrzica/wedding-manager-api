app.jwt.trajanje-sati=168

# Mail: lokalno ga hvata Mailpit (http://localhost:8025)
spring.mail.host=localhost
spring.mail.port=1025
app.mail.posiljatelj=Wedding Manager <noreply@wedding-manager.local>

# Adrese s kojih frontend smije zvati API
app.cors.dozvoljeni=http://localhost:4200
